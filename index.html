<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Untuk Kamu 🤎</title>


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      height: 100%;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;

      background: #fff8e5;
    }


    button {
      font-family: inherit;
    }



    /* =====================================================
       PAGE
    ===================================================== */

    .page {

      width: 100%;
      height: 100vh;

      min-height: 600px;

      display: none;

      justify-content: center;
      align-items: center;

      position: relative;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(143, 166, 106, 0.25),
          transparent 25%
        ),

        radial-gradient(
          circle at 85% 80%,
          rgba(107, 70, 54, 0.10),
          transparent 25%
        ),

        #fff8e5;
    }


    .page.active {
      display: flex;
    }



    /* =====================================================
       DEKORASI BACKGROUND
    ===================================================== */

    .decor {

      position: absolute;

      z-index: 1;

      color: #8fa66a;

      opacity: 0.65;

      pointer-events: none;

      animation:
        floating
        3s
        ease-in-out
        infinite;
    }


    .decor-1 {
      top: 12%;
      left: 9%;

      font-size: 30px;
    }


    .decor-2 {
      top: 20%;
      right: 12%;

      font-size: 22px;

      animation-delay: 0.5s;
    }


    .decor-3 {
      bottom: 18%;
      left: 14%;

      font-size: 26px;

      animation-delay: 1s;
    }


    .decor-4 {
      bottom: 12%;
      right: 12%;

      font-size: 31px;

      animation-delay: 1.5s;
    }


    .decor-5 {
      top: 48%;
      left: 6%;

      font-size: 18px;

      animation-delay: 2s;
    }


    .decor-6 {
      top: 55%;
      right: 7%;

      font-size: 20px;

      animation-delay: 0.8s;
    }


    @keyframes floating {

      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0);
      }

    }



    /* =====================================================
       CARD
    ===================================================== */

    .card {

      width: 315px;

      min-height: 450px;

      padding:
        28px
        18px;

      background:
        rgba(
          255,
          243,
          199,
          0.97
        );

      border:
        2px solid
        #8fa66a;

      border-radius: 14px;

      box-shadow:
        0 10px 30px
        rgba(
          107,
          70,
          54,
          0.16
        );

      display: flex;

      flex-direction: column;

      align-items: center;

      text-align: center;

      position: relative;

      z-index: 5;
    }



    /* =====================================================
       PAGE 1
       LOADING
    ===================================================== */

    .loading-card {

      justify-content: center;
    }


    .loading-title {

      margin-top: 10px;

      color: #6b4636;

      font-size: 27px;

      font-weight: 800;
    }


    .loading-subtitle {

      margin-top: 7px;

      color: #657a45;

      font-size: 15px;

      font-weight: 600;
    }



    /* =====================================================
       FORMAT GIF LOADING
    ===================================================== */

    .gif-loading {

      width: 180px;

      height: 180px;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      margin-bottom: 5px;

      /*
        GIF KAMU:

        gif/loading.gif
      */
    }


    .gif-loading img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: block;
    }



    /* =====================================================
       LOADING BAR
    ===================================================== */

    .loading-bar {

      width: 185px;

      height: 8px;

      margin-top: 25px;

      background: #d9dfc7;

      border-radius: 20px;

      overflow: hidden;
    }


    .loading-progress {

      width: 0%;

      height: 100%;

      background: #8fa66a;

      border-radius: 20px;

      animation:
        loadingProgress
        2.8s
        linear
        forwards;
    }


    @keyframes loadingProgress {

      from {
        width: 0%;
      }

      to {
        width: 100%;
      }

    }



    /* =====================================================
       TITLE
    ===================================================== */

    .title {

      color: #6b4636;

      font-size: 31px;

      font-weight: 800;

      line-height: 1.2;
    }


    .subtitle {

      margin-top: 6px;

      color: #657a45;

      font-size: 18px;

      font-weight: 700;

      line-height: 1.35;
    }



    /* =====================================================
       FORMAT GIF PERTANYAAN
    ===================================================== */

    .gif-question {

      width: 235px;

      height: 235px;

      margin-top: 10px;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      /*
        GIF KAMU:

        gif/question.gif
      */
    }


    .gif-question img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: block;
    }



    /* =====================================================
       BUTTON AREA
    ===================================================== */

    .buttons {

      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      margin-top: 4px;
    }


    .buttons button {

      border: none;

      padding:
        11px
        27px;

      border-radius: 8px;

      color: #fff8e5;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform
        0.15s
        ease,

        background
        0.2s
        ease;
    }


    .buttons button:active {

      transform:
        scale(0.92);
    }



    /* =====================================================
       BUTTON MAUU
    ===================================================== */

    .yes-button {

      background: #8fa66a;
    }


    .yes-button:hover {

      background: #657a45;
    }



    /* =====================================================
       BUTTON ENGGAA
    ===================================================== */

    .no-button {

      background: #9b7059;

      position: relative;
    }


    .no-button:hover {

      background: #6b4636;
    }



    /* =====================================================
       TEXT KECIL
    ===================================================== */

    .small-text {

      margin-top: 17px;

      color: #8b6a56;

      font-size: 13px;
    }



    /* =====================================================
       PAGE 3
       THANKS
    ===================================================== */

    .gif-thanks {

      width: 240px;

      height: 240px;

      margin-top: 8px;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      /*
        GIF KAMU:

        gif/thanks.gif
      */
    }


    .gif-thanks img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: block;
    }



    /* =====================================================
       MESSAGE
    ===================================================== */

    .message {

      margin-top: 0;

      color: #657a45;

      font-size: 14px;

      line-height: 1.7;
    }


    .message-name {

      margin-bottom: 5px;

      color: #6b4636;

      font-size: 18px;

      font-weight: 800;
    }



    /* =====================================================
       BUTTON MULAI LAGI
    ===================================================== */

    .back-button {

      margin-top: 15px;

      padding:
        9px
        20px;

      border-radius: 8px;

      border:
        2px solid
        #8fa66a;

      background: transparent;

      color: #657a45;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition:
        0.2s ease;
    }


    .back-button:hover {

      background: #d9dfc7;
    }



    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      .page {

        min-height: 100vh;
      }


      .card {

        width: 310px;

        min-height: 440px;
      }


      .title {

        font-size: 29px;
      }


      .subtitle {

        font-size: 17px;
      }


      .gif-question {

        width: 220px;

        height: 220px;
      }


      .gif-thanks {

        width: 225px;

        height: 225px;
      }


      .decor-1 {

        left: 5%;
      }


      .decor-2 {

        right: 5%;
      }


      .decor-3 {

        left: 7%;
      }


      .decor-4 {

        right: 6%;
      }

    }



    /* =====================================================
       HP KECIL
    ===================================================== */

    @media (max-width: 350px) {

      .card {

        width: 290px;

        min-height: 420px;

        padding-left: 12px;

        padding-right: 12px;
      }


      .gif-loading {

        width: 165px;

        height: 165px;
      }


      .gif-question {

        width: 205px;

        height: 205px;
      }


      .gif-thanks {

        width: 210px;

        height: 210px;
      }


      .title {

        font-size: 27px;
      }


      .subtitle {

        font-size: 16px;
      }


      .buttons button {

        padding:
          10px
          22px;
      }

    }

  </style>

</head>



<body>


  <!-- =====================================================
       PAGE 1
       LOADING
  ====================================================== -->

  <section
    class="page page-1 active"
  >

    <!-- Background -->
    <div class="decor decor-1">♡</div>

    <div class="decor decor-2">✦</div>

    <div class="decor decor-3">♡</div>

    <div class="decor decor-4">✦</div>

    <div class="decor decor-5">♡</div>

    <div class="decor decor-6">✦</div>


    <div
      class="card loading-card"
    >


      <!-- =================================================
           TEMPAT GIF LOADING
           
           Masukkan file:
           gif/loading.gif
      ================================================== -->

      <div class="gif-loading">

        <img
          src="icon1.webp"
          alt="Loading GIF"
        >

      </div>


      <h1 class="loading-title">
        Tunggu sebentar...
      </h1>


      <p class="loading-subtitle">
        ada sesuatu buat kamu
      </p>


      <!-- Loading bar -->

      <div class="loading-bar">

        <div
          class="loading-progress"
        ></div>

      </div>


    </div>

  </section>



  <!-- =====================================================
       PAGE 2
       PERTANYAAN
  ====================================================== -->

  <section
    class="page page-2"
  >


    <!-- Background -->

    <div class="decor decor-1">♡</div>

    <div class="decor decor-2">✦</div>

    <div class="decor decor-3">♡</div>

    <div class="decor decor-4">✦</div>

    <div class="decor decor-5">♡</div>

    <div class="decor decor-6">✦</div>



    <div class="card">


      <h1 class="title">
        Hai kamu,
      </h1>


      <h2 class="subtitle">
        Kamu mau jadi pacarku?
      </h2>



      <!-- =================================================
           TEMPAT GIF PERTANYAAN

           Masukkan file:
           gif/question.gif
      ================================================== -->

      <div class="gif-question">

        <img
          src="icon2.webp"
          alt="Question GIF"
        >

      </div>



      <!-- =================================================
           BUTTON
      ================================================== -->

      <div class="buttons">


        <button
          class="yes-button"
          id="yesButton"
        >
          Mauu
        </button>


        <button
          class="no-button"
          id="noButton"
        >
          Enggaa
        </button>


      </div>


      <p class="small-text">
        jangan lama-lama mikirnya...
      </p>


    </div>

  </section>



  <!-- =====================================================
       PAGE 3
       MAKASII
  ====================================================== -->

  <section
    class="page page-3"
  >


    <!-- Background -->

    <div class="decor decor-1">♡</div>

    <div class="decor decor-2">✦</div>

    <div class="decor decor-3">♡</div>

    <div class="decor decor-4">✦</div>

    <div class="decor decor-5">♡</div>

    <div class="decor decor-6">✦</div>



    <div class="card">


      <h1 class="title">
        Makasii!
      </h1>


      <h2 class="subtitle">
        akhirnya kamu bilang mau
      </h2>



      <!-- =================================================
           TEMPAT GIF THANKS

           Masukkan file:
           gif/thanks.gif
      ================================================== -->

      <div class="gif-thanks">

        <img
          src="icon3.webp"
          alt="Thanks GIF"
        >

      </div>



      <!-- =================================================
           PESAN
      ================================================== -->

      <div class="message">


        <p>

          Makasih yaa udah mau.

          <br>

          Semoga kita bisa saling cerita,

          <br>

          saling ngerti,

          <br>

          dan saling nemenin.

        </p>


      </div>



      <!-- =================================================
           BUTTON MULAI LAGI
      ================================================== -->

      <button
        class="back-button"
        id="backButton"
      >
        mulai lagi
      </button>


    </div>

  </section>



  <!-- =====================================================
       MUSIK
       
       Masukkan file:
       music.mp3
  ====================================================== -->

  <audio
    id="backgroundMusic"
    src="music.mp3"
    loop
    preload="auto"
  ></audio>



  <script>


    /* =====================================================
       AMBIL PAGE
    ===================================================== */

    const page1 =
      document.querySelector(".page-1");

    const page2 =
      document.querySelector(".page-2");

    const page3 =
      document.querySelector(".page-3");



    /* =====================================================
       FUNGSI PINDAH PAGE
    ===================================================== */

    function showPage(pageNumber) {


      page1.classList.remove("active");

      page2.classList.remove("active");

      page3.classList.remove("active");


      if (pageNumber === 1) {

        page1.classList.add("active");

      }


      if (pageNumber === 2) {

        page2.classList.add("active");

      }


      if (pageNumber === 3) {

        page3.classList.add("active");

      }

    }



    /* =====================================================
       LOADING 2.8 DETIK
    ===================================================== */

    setTimeout(
      function () {

        showPage(2);

      },
      2800
    );



    /* =====================================================
       MUSIK
    ===================================================== */

    const music =
      document.getElementById(
        "backgroundMusic"
      );


    function startMusic() {

      if (!music) return;


      music.volume = 0.7;


      music
        .play()
        .catch(
          function () {}
        );

    }



    /* =====================================================
       BUTTON MAUU
    ===================================================== */

    const yesButton =
      document.getElementById(
        "yesButton"
      );


    yesButton.addEventListener(
      "click",
      function () {


        /* mulai musik */

        startMusic();


        /* pindah ke page 3 */

        showPage(3);

      }
    );



    /* =====================================================
       BUTTON ENGGAA
       KABUR SAAT DISENTUH / DIARAHKAN
    ===================================================== */

    const noButton =
      document.getElementById(
        "noButton"
      );


    function moveNoButton() {


      const buttonWidth = 100;

      const buttonHeight = 45;


      const maxX =
        window.innerWidth
        -
        buttonWidth
        -
        20;


      const maxY =
        window.innerHeight
        -
        buttonHeight
        -
        20;


      const randomX =
        Math.max(
          10,
          Math.random() * maxX
        );


      const randomY =
        Math.max(
          10,
          Math.random() * maxY
        );


      noButton.style.position =
        "fixed";


      noButton.style.left =
        randomX + "px";


      noButton.style.top =
        randomY + "px";


      noButton.style.zIndex =
        "9999";

    }



    /* Desktop */

    noButton.addEventListener(
      "mouseenter",
      moveNoButton
    );



    /* HP */

    noButton.addEventListener(
      "touchstart",
      function (event) {

        event.preventDefault();

        moveNoButton();

      }
    );



    /* =====================================================
       BUTTON MULAI LAGI
    ===================================================== */

    const backButton =
      document.getElementById(
        "backButton"
      );


    backButton.addEventListener(
      "click",
      function () {


        /* Kembalikan posisi tombol */

        noButton.style.position =
          "relative";


        noButton.style.left =
          "auto";


        noButton.style.top =
          "auto";


        /* kembali ke pertanyaan */

        showPage(2);

      }
    );



    /* =====================================================
       MUSIK SAAT USER BERINTERAKSI
       
       Browser HP sering memblokir autoplay.
       Karena itu musik juga dicoba setelah
       interaksi pertama.
    ===================================================== */

    document.addEventListener(
      "click",
      function () {


        if (
          music &&
          music.paused
        ) {

          music
            .play()
            .catch(
              function () {}
            );

        }

      },
      {
        once: true
      }
    );


  </script>


</body>
</html>
